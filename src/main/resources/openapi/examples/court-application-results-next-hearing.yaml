summary: Court application whose own results carry next hearings
description: >-
  nextHearing is set on each court application result that fixes one,
  the same as on offence results. Here the application is adjourned
  (NHMC) to one court and date and the defendant is remanded (RI) to a
  different court and date, so each result carries its own nextHearing.
  A remand's next hearing is entered as a child result in CP; it is
  returned on the remand result, not as a separate result.
